name: Publish Python Distribution to PyPI

on:
  push:
    tags:
      - 'v*' # Trigger the workflow only when a version tag (e.g., v0.1.0) is pushed

jobs:
  build-n-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # CRITICAL: Required for OIDC Trusted Publishing authentication

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: python -m pip install build

    - name: Build distribution packages (tar.gz and whl)
      run: python -m build

    - name: Publish package to PyPI via Trusted Publisher
      uses: pypa/gh-action-pypi-publish@release/v1
